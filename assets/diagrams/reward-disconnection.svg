<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 790" role="img" aria-labelledby="title desc"><title id="title">Notificación perdida después de acreditar</title><desc id="desc">Ejemplo de desconexión después de acreditar la recompensa y antes de recibir la notificación. No representa todas las posibles ventanas de falla.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#8495a9"/></marker></defs><rect width="750" height="790" fill="#fff"/><g font-family="Segoe UI,Arial,sans-serif"><rect x="15" y="24" width="170" height="60" rx="12" fill="#eef4ff" stroke="#adc4e8"/><text x="100" y="60" text-anchor="middle" font-size="18" fill="#243e5d"><tspan x="100" dy="0">Jugador A</tspan></text><path d="M100 84V760" stroke="#b5c1d0" stroke-dasharray="6 5"/><rect x="285" y="24" width="170" height="60" rx="12" fill="#eef4ff" stroke="#adc4e8"/><text x="370" y="60" text-anchor="middle" font-size="18" fill="#243e5d"><tspan x="370" dy="0">Instancia de combate</tspan></text><path d="M370 84V760" stroke="#b5c1d0" stroke-dasharray="6 5"/><rect x="565" y="24" width="170" height="60" rx="12" fill="#eef4ff" stroke="#adc4e8"/><text x="650" y="60" text-anchor="middle" font-size="18" fill="#243e5d"><tspan x="650" dy="0">Recompensas</tspan></text><path d="M650 84V760" stroke="#b5c1d0" stroke-dasharray="6 5"/><path d="M100 145 L370 145" stroke="#8495a9" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><text x="235" y="130" text-anchor="middle" font-size="18" fill="#243e5d"><tspan x="235" dy="0">Atacar al jefe</tspan></text><path d="M370 195h45v36h-45" stroke="#8495a9" fill="none" stroke-width="2" marker-end="url(#arrow)"/><text x="430" y="213" text-anchor="start" font-size="16" fill="#243e5d"><tspan x="430" dy="0">HP llega a cero</tspan></text><path d="M370 275h45v36h-45" stroke="#8495a9" fill="none" stroke-width="2" marker-end="url(#arrow)"/><text x="430" y="293" text-anchor="start" font-size="16" fill="#243e5d"><tspan x="430" dy="0">Identificar autor</tspan><tspan x="430" dy="25">del golpe final</tspan></text><path d="M370 390 L650 390" stroke="#8495a9" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><text x="510" y="375" text-anchor="middle" font-size="18" fill="#243e5d"><tspan x="510" dy="0">Solicitar entrega de recompensa</tspan></text><path d="M650 450h45v36h-45" stroke="#8495a9" fill="none" stroke-width="2" marker-end="url(#arrow)"/><text x="638" y="468" text-anchor="end" font-size="16" fill="#243e5d"><tspan x="638" dy="0">Acreditar</tspan></text><rect x="28" y="530" width="694" height="50" rx="12" fill="#f1f5fa" stroke="#dce3ed"/><text x="375" y="561" text-anchor="middle" font-size="18" fill="#243e5d"><tspan x="375" dy="0">F1 · El jugador pierde conexión</tspan></text><path d="M650 650 L100 650" stroke="#8495a9" fill="none" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="375" y="635" text-anchor="middle" font-size="18" fill="#243e5d"><tspan x="375" dy="0">Notificar recompensa</tspan></text><text x="100" y="675" text-anchor="middle" font-size="30" fill="#b95845"><tspan x="100" dy="0">×</tspan></text><rect x="28" y="710" width="694" height="50" rx="12" fill="#f1f5fa" stroke="#dce3ed"/><text x="375" y="741" text-anchor="middle" font-size="18" fill="#243e5d"><tspan x="375" dy="0">El cliente no recibe la confirmación</tspan></text></g></svg>