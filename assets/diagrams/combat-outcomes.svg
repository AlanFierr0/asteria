<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 704" role="img" aria-labelledby="title desc"><title id="title">Victoria y derrota</title><desc id="desc">P1 entrega recompensas por victoria. P5 representa el fin por tiempo y la derrota sin recompensas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#8495a9"/></marker></defs><rect width="720" height="704" fill="#fff"/><g font-family="Segoe UI,Arial,sans-serif"><rect x="160" y="24" width="400" height="76" rx="12" fill="#eef4ff" stroke="#adc4e8"/><text x="360" y="56" text-anchor="middle" font-size="18" fill="#243e5d"><tspan x="360" dy="0">Jugadores de las tres regiones</tspan><tspan x="360" dy="25">combaten contra el jefe</tspan></text><path d="M360 100 L360 140" stroke="#8495a9" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><rect x="160" y="140" width="400" height="64" rx="12" fill="#eef4ff" stroke="#adc4e8"/><text x="360" y="178" text-anchor="middle" font-size="18" fill="#243e5d"><tspan x="360" dy="0">¿Cómo finaliza el combate?</tspan></text><path d="M360 204 L180 260" stroke="#8495a9" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><path d="M360 204 L540 260" stroke="#8495a9" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><rect x="40" y="260" width="280" height="60" rx="12" fill="#eef4ff" stroke="#adc4e8"/><text x="180" y="296" text-anchor="middle" font-size="18" fill="#243e5d"><tspan x="180" dy="0">HP llega a cero a tiempo</tspan></text><rect x="400" y="260" width="280" height="60" rx="12" fill="#eef4ff" stroke="#adc4e8"/><text x="540" y="296" text-anchor="middle" font-size="18" fill="#243e5d"><tspan x="540" dy="0">Se agota el tiempo</tspan></text><path d="M180 320 L180 360" stroke="#8495a9" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><path d="M540 320 L540 360" stroke="#8495a9" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><rect x="60" y="360" width="240" height="64" rx="12" fill="#e8f7ef" stroke="#acd8c0"/><text x="180" y="398" text-anchor="middle" font-size="18" fill="#243e5d"><tspan x="180" dy="0">VICTORIA · P1</tspan></text><rect x="420" y="360" width="240" height="64" rx="12" fill="#fff0ed" stroke="#e2b3a9"/><text x="540" y="398" text-anchor="middle" font-size="18" fill="#243e5d"><tspan x="540" dy="0">DERROTA · P5</tspan></text><path d="M180 424 L180 464" stroke="#8495a9" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><path d="M540 424 L540 464" stroke="#8495a9" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><rect x="40" y="464" width="280" height="84" rx="12" fill="#e8f7ef" stroke="#acd8c0"/><text x="180" y="500" text-anchor="middle" font-size="18" fill="#243e5d"><tspan x="180" dy="0">Identificar participantes</tspan><tspan x="180" dy="25">y autor del golpe final</tspan></text><rect x="400" y="464" width="280" height="84" rx="12" fill="#fff0ed" stroke="#e2b3a9"/><text x="540" y="512" text-anchor="middle" font-size="18" fill="#243e5d"><tspan x="540" dy="0">No entregar recompensas</tspan></text><path d="M180 548 L180 588" stroke="#8495a9" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><path d="M540 548 L540 588" stroke="#8495a9" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><rect x="40" y="588" width="280" height="84" rx="12" fill="#e8f7ef" stroke="#acd8c0"/><text x="180" y="624" text-anchor="middle" font-size="18" fill="#243e5d"><tspan x="180" dy="0">Determinar y entregar</tspan><tspan x="180" dy="25">recompensas</tspan></text><rect x="400" y="588" width="280" height="84" rx="12" fill="#fff0ed" stroke="#e2b3a9"/><text x="540" y="636" text-anchor="middle" font-size="18" fill="#243e5d"><tspan x="540" dy="0">Jugadores salen de la zona</tspan></text></g></svg>